[project]
name = "seeder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "alembic-postgresql-enum>=1.10.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "case-convert>=1.1.0",
    "fastapi>=0.141.1",
    "fastapi-tailwind>=2.0.4a1",
    "inflect>=7.5.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "python-slugify>=9.0.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["hatchling >= 1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
manage = "manage:main"

[tool.pytest.ini_options]
asyncio_mode = "auto" 
